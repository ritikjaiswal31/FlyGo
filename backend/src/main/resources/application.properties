spring.application.name=FlyGo
server.port=8082

#MYSQL CONNECTION
spring.datasource.url=jdbc:mysql://localhost:3306/flygo
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update


jwtSecreteString=${JWT_SECRET}

#Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${ADMIN_EMAIL}
spring.mail.password=${ADMIN_EMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


frontendLoginUrl=http://localhost:3000/login
viewBookingUrl=http://localhost:3000/my-bookings






